[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "python-pytest-fixture"
version = "0.1.0"
dependencies = ["requests>=2.32"]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
  "pytest-cov>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
