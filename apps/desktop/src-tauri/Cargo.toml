[package]
name = "local-code-verifier"
version = "0.1.0"
description = "Tauri shell for the local deterministic verification engine"
authors = ["Local Verify contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "local_code_verifier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["io-util", "process", "rt-multi-thread", "sync"] }
